name: Build Executables Multiplataforma

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Limpador-PC-Windows.exe
            build_cmd: python build_executable.py
            output_path: dist/Limpador-PC.exe
          - os: ubuntu-latest
            artifact_name: Limpador-PC-Linux
            build_cmd: python build_executable.py
            output_path: dist/Limpador-PC
          - os: macos-latest
            artifact_name: Limpador-PC-macOS
            build_cmd: python build_executable.py
            output_path: dist/Limpador-PC

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar PyInstaller e Dependências
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Executar Testes Automatizados
      run: |
        python -m unittest discover -s tests -v

    - name: Compilar Executável Standalone
      run: ${{ matrix.build_cmd }}

    - name: Renomear binário para distribuição
      shell: bash
      run: |
        cp ${{ matrix.output_path }} dist/${{ matrix.artifact_name }}

    - name: Upload do Artefato Compilado
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.artifact_name }}

  release:
    name: Publicar Release no GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Baixar todos os artefatos
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Criar GitHub Release com os 3 Executáveis
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/Limpador-PC-Windows.exe/Limpador-PC-Windows.exe
          artifacts/Limpador-PC-Linux/Limpador-PC-Linux
          artifacts/Limpador-PC-macOS/Limpador-PC-macOS
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
